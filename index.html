<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>AI 친구 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* Always bright, even when the device is in dark mode. */
  :root {
    --ink: #22304d; --muted: #6b7690; --card: #ffffff; --line: #e7edf6;
    --blue: #3f8cff; --sky: #36c5e0; --coral: #ff7a59; --pink: #ff5c93; --sun: #ffc940;
    --shadow: 0 2px 6px rgba(63,140,255,.08), 0 18px 40px rgba(63,110,200,.16);
    --display: "Jua", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: #eaf5ff; }
  body { margin: 0; min-height: 100vh; color: var(--ink); position: relative; overflow-x: hidden;
    background: linear-gradient(160deg, #e3f2ff 0%, #fdf8ee 52%, #ffeef4 100%);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: .55; pointer-events: none; z-index: 0; }
  .blob.a { width: 340px; height: 340px; background: #a8d8ff; top: -80px; left: -80px; }
  .blob.b { width: 300px; height: 300px; background: #ffd6a5; bottom: -60px; right: -60px; }
  .blob.c { width: 220px; height: 220px; background: #ffc6dc; top: 40%; right: 8%; opacity: .4; }
  main { position: relative; z-index: 1; max-width: 860px; margin: 0 auto; padding: 30px 16px 48px; }
  .title { text-align: center; margin-bottom: 22px; }
  .title h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 2.3rem; color: #2b5fd9; letter-spacing: .01em; }
  .title h1 span { color: var(--coral); }
  .title p { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }

  /* Student ID card */
  .id { background: var(--card); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; }
  .id-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #fff; padding: 14px 24px;
    background: linear-gradient(100deg, var(--blue) 0%, var(--sky) 100%); }
  .id-head .school { font-family: var(--display); font-size: 1.2rem; letter-spacing: .02em; }
  .id-head .kind { font-size: .78rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    background: rgba(255,255,255,.22); padding: 5px 10px; border-radius: 999px; }
  .id-body { display: grid; grid-template-columns: 290px 1fr; gap: 28px; padding: 26px 24px 24px; }
  .photo { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 300 / 340; align-self: start; background: #f2f7ff;
    border: 6px solid #fff; box-shadow: 0 0 0 1px var(--line), 0 10px 24px rgba(63,110,200,.18); }
  .photo svg { display: block; width: 100%; height: 100%; }
  .photo.enter svg { animation: enter .55s cubic-bezier(.2,.8,.2,1.1); }
  @keyframes enter { from { opacity: 0; transform: scale(.94) translateY(8px); } to { opacity: 1; transform: none; } }

  .name-row { display: flex; align-items: center; gap: 12px; }
  .name { font-size: 2.1rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
  .flag { display: inline-block; vertical-align: middle; border-radius: 4px; flex: none;
    box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 2px 5px rgba(0,0,0,.12); }
  .readings { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .reading { display: inline-flex; align-items: center; gap: 8px; background: #f3f7ff; border-radius: 999px; padding: 6px 14px 6px 6px; }
  .reading .lbl { font-size: .74rem; font-weight: 700; color: #fff; background: var(--blue); border-radius: 999px; padding: 3px 9px; }
  .reading.native .lbl { background: #8c6cff; }
  .reading .val { font-weight: 700; font-size: 1.08rem; }
  .listen { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px; }
  .listen button { display: inline-flex; align-items: center; gap: 6px; border: 0; padding: 10px 16px; border-radius: 999px;
    font-size: .95rem; font-weight: 700; cursor: pointer; transition: transform .15s; }
  .listen button:hover { transform: translateY(-2px); }
  .listen #sayNative { background: #fff1c7; color: #7a5200; }
  .listen #sayEnglish { background: #dff1ff; color: #1d5fb8; }
  .note { font-size: .8rem; color: var(--muted); min-height: 1.2em; }

  dl { margin: 8px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  dl div { border-radius: 16px; padding: 10px 14px; background: var(--tile); }
  dt { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  dt .ic { font-size: 1rem; }
  dt small { opacity: .8; }
  dd { margin: 3px 0 0; font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .id-foot { display: flex; justify-content: space-between; gap: 12px; border-top: 2px dashed var(--line);
    padding: 12px 24px; color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }

  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  .btn { border: 0; border-radius: 999px; padding: 14px 26px; font-size: 1.05rem; font-weight: 800; cursor: pointer;
    transition: transform .15s, box-shadow .15s; }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn.primary { color: #fff; background: linear-gradient(100deg, var(--coral), var(--pink)); box-shadow: 0 10px 22px rgba(255,92,147,.32); }
  .btn.secondary { color: #2b5fd9; background: #fff; box-shadow: 0 0 0 2px #cfe0ff, 0 8px 18px rgba(63,110,200,.12); }
  .pick { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 16px; color: var(--muted); font-weight: 700; }
  .pick select { padding: 9px 14px; border-radius: 999px; border: 2px solid #cfe0ff; background: #fff; color: var(--ink); font-size: .95rem; font-weight: 600; }

  /* ---- portrait motion ---- */
  .ppl .figure { animation: breathe 4.6s ease-in-out infinite; }
  .ppl .shoulders { transform-box: view-box; transform-origin: 150px 340px; animation: chest 4.6s ease-in-out infinite; }
  .ppl .head { transform-box: view-box; transform-origin: 150px 236px; animation: sway 7.5s ease-in-out infinite; }
  .ppl .eye { transform-box: fill-box; transform-origin: 50% 55%; animation: blink var(--blink, 5s) var(--blink-delay, 0s) infinite; }
  .ppl .iris { transform: translate(var(--lx, 0px), var(--ly, 0px)); transition: transform .35s ease-out; }
  .ppl .brows { transition: transform .3s; }
  .ppl .m-talk { opacity: 0; }
  .talking .ppl .m-rest { opacity: 0; }
  .talking .ppl .m-talk { opacity: 1; transform-box: fill-box; transform-origin: 50% 20%; animation: talk .16s ease-in-out infinite alternate; }
  .talking .ppl .brows { transform: translateY(-1.5px); }
  .ppl .bokeh { animation: drift 14s ease-in-out infinite alternate; }
  @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.8px); } }
  @keyframes chest { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.012, 1.02); } }
  @keyframes sway { 0%, 100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.6deg); } }
  @keyframes blink { 0%, 44%, 50%, 100% { transform: scaleY(1); } 47% { transform: scaleY(.08); } }
  @keyframes talk { from { transform: scaleY(.45); } to { transform: scaleY(1.05); } }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(14px, -10px); } }
  @media (prefers-reduced-motion: reduce) {
    .ppl *, .photo.enter svg { animation: none !important; transition: none !important; }
  }

  @media (max-width: 680px) {
    main { padding-top: 20px; }
    .title h1 { font-size: 1.9rem; }
    .id-body { grid-template-columns: 1fr; gap: 18px; padding: 20px 16px; }
    .photo { width: min(280px, 100%); margin: 0 auto; }
    .name-row, .readings, .listen { justify-content: center; }
    .note { text-align: center; }
    dl { gap: 8px; }
    dt small { display: none; }
    .id-head { padding: 12px 16px; }
    .id-head .school { font-size: 1.05rem; white-space: nowrap; }
    .id-head .kind { white-space: nowrap; font-size: .7rem; }
  }
</style>
</head>

<div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
<main>
  <div class="title">
    <h1>AI 친구 <span>만들기</span></h1>
    <p>버튼을 눌러 세계 여러 나라의 새 친구를 만나 보세요!</p>
  </div>

  <article class="id" aria-live="polite">
    <div class="id-head">
      <span class="school">Global Friends School</span>
      <span class="kind">Student ID</span>
    </div>
    <div class="id-body">
      <div class="photo" id="photo"></div>
      <div>
        <div class="name-row"><span id="nameFlag"></span><h2 class="name" id="name"></h2></div>
        <div class="readings" id="readings"></div>
        <div class="listen">
          <button type="button" id="sayNative">🔊 이름 듣기 <span id="langLabel"></span></button>
          <button type="button" id="sayEnglish">🔊 영어로 듣기</button>
        </div>
        <div class="note" id="note"></div>
        <dl id="info"></dl>
      </div>
    </div>
    <div class="id-foot"><span id="idNo"></span><span>Grade 6</span></div>
  </article>

  <div class="actions">
    <button class="btn primary" id="newBtn">✨ 새로운 친구 만들기</button>
    <button class="btn secondary" id="renameBtn">🔄 이름만 바꾸기</button>
  </div>
  <div class="pick">
    <label for="countrySel">🌏 국적</label>
    <select id="countrySel"></select>
  </div>
</main>

function star(cx, cy, r, points = 5, rot = -90, inner = .382) {
  const pts = [];
  for (let i = 0; i < points * 2; i++) {
    const a = (rot + i * 180 / points) * Math.PI / 180, rr = i % 2 ? r * inner : r;
    pts.push(`${(cx + rr * Math.cos(a)).toFixed(2)},${(cy + rr * Math.sin(a)).toFixed(2)}`);
  }
  return `M${pts.join(" L")} Z`;
}

const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];

function makeName(c, gender, avoid) {
  for (let i = 0; i < 30; i++) {
    const g = pick(gender === "M" ? c.m : c.f), fam = pick(c.fam);
    const en = `${g.en} ${fam.en}`;
    if (en === avoid) continue;
    const familyFirst = c.order === "family";
    return {
      en,
      native: familyFirst ? fam.native + c.sep + g.native : `${g.native} ${fam.native}`,
      ko: familyFirst ? fam.ko + (c.koSep ?? " ") + g.ko : `${g.ko} ${fam.ko}`,
    };
  }
}

function makeStudent(countryId) {
  const c = COUNTRIES.find(x => x.id === countryId) || pick(COUNTRIES);
  const gender = Math.random() < .5 ? "M" : "F";
  const skin = pick(c.skin);
  const darkFeatures = skin >= 3 || ["KR","JP","CN","VN","IN","EG","MX"].includes(c.id);
  const hair = darkFeatures ? pick([0, 0, 1]) : pick([0, 1, 2, 2, 3, 3, 4, 5]);
  const eye = darkFeatures ? pick([0, 1]) : pick([0, 1, 2, 3, 4, 5]);
  let style = pick(STYLES[gender]);
  if (c.curly && Math.random() < .6) style = gender === "M" ? pick(["curly", "buzz"]) : "curlyLong";
  const height = round(rand(140, 168), 1);
  return {
    country: c.id, gender, ...makeName(c, gender),
    look: { skin, hair, eye, style, glasses: Math.random() < .2, smile: Math.random() < .5 ? "open" : "closed",
            backdrop: randInt(0, BACKDROP.length - 1), uniform: randInt(0, UNIFORM.length - 1) },
    height,
    weight: round(clamp((height - 100) * .78 + rand(-7, 8), 30, 66), 1),
    grip:   round(clamp((height - 120) * .45 + rand(-5, 7), 12, 38), 1),
    run:    round(rand(7.6, 10.4), 2),
    pen:    round(rand(12, 18.5), 1),
    bag:    randInt(6, 15),
    idNo:   `GFS-${new Date().getFullYear()}-${String(randInt(1, 9999)).padStart(4, "0")}`,
  };
}

    <filter id="${p}b1" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter>

    <circle cx="236" cy="30" r="18" fill="${mix(bg2, -.06)}" opacity=".6"/><circle cx="34" cy="190" r="22" fill="#fff" opacity=".35"/>

      <path d="M127,192 L126,250 Q150,266 174,250 L173,192 Z" fill="${u("neck")}"/>

      <path d="M28,340 C32,288 76,262 150,258 C224,262 268,288 272,340 Z" fill="${u("coat")}"/>

      <path d="M58,330 Q70,306 92,296 M242,330 Q232,308 212,298" stroke="${mix(blazer, -.35)}" stroke-width="3" fill="none" opacity=".35" filter="${u("b1")}"/>
      <path d="M116,256 Q150,248 184,256 L150,322 Z" fill="#f8f7f3"/>

      <path d="M124,251 L150,268 L139,288 L113,262 Z M176,251 L150,268 L161,288 L187,262 Z" fill="#ffffff" stroke="#d9d8d2" stroke-width="1"/>

      ${neckwear}
      <path d="M114,258 L150,324 L138,340 L108,340 L98,284 Z M186,258 L150,324 L162,340 L192,340 L202,284 Z" fill="${mix(blazer, -.16)}"/>

      <path d="${star(207.5, 305, 3.2)}" fill="${blazer}" opacity=".85"/>
    </g>

    <g class="head">
      ${earSvg(92, 1)}${earSvg(208, -1)}

      <path d="${FACE}" fill="${u("skin")}"/>
      <g clip-path="${u("face")}">
        <ellipse cx="206" cy="160" rx="24" ry="72" fill="${deep}" opacity=".3" filter="${u("b8")}"/>

}

// ---------- speech ----------
let voices = [];
const loadVoices = () => { try { voices = speechSynthesis.getVoices(); } catch (e) {} };
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function findVoice(lang) {
  const base = lang.split("-")[0];
  return voices.find(v => v.lang.replace("_", "-") === lang) || voices.find(v => v.lang.startsWith(base));
}
let talkTimer;
function setTalking(on) {
  $("photo").classList.toggle("talking", on);
  clearTimeout(talkTimer);
}
// Returns true when a voice for the language was found, false when the browser falls back to its default.
function say(text, lang) {
  loadVoices();
  const voice = findVoice(lang);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = .85;
  if (voice) u.voice = voice;
  u.onstart = () => setTalking(true);
  u.onend = u.onerror = () => setTalking(false);
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  // Some browsers never fire onstart/onend, so animate for roughly the length of the name anyway.
  setTalking(true);
  talkTimer = setTimeout(() => setTalking(false), 900 + text.length * 110);
  return !!voice;
}

// ---------- eyes follow the pointer, and wander when it is still ----------
let lastPointer = 0;
function setLook(x, y) {
  const svg = $("photo").querySelector("svg");
  if (svg) { svg.style.setProperty("--lx", `${x.toFixed(2)}px`); svg.style.setProperty("--ly", `${y.toFixed(2)}px`); }
}
document.addEventListener("pointermove", e => {
  lastPointer = Date.now();
  const r = $("photo").getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height * .42);
  const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 280);
  setLook(dx / d * 2.3 * k, dy / d * 1.5 * k);
});
setInterval(() => {
  if (Date.now() - lastPointer < 3000) return;
  const [x, y] = pick([[0, 0], [0, 0], [-2, .3], [2, .3], [1.3, -.8], [-1.3, 1]]);
  setLook(x, y);
}, 2600);

// ---------- render ----------
let student;
const countryOf = s => COUNTRIES.find(x => x.id === s.country);
function render(animate = true) {
  const c = countryOf(student);
  const photo = $("photo");
  photo.innerHTML = portrait(student);
  if (animate) { photo.classList.remove("enter"); void photo.offsetWidth; photo.classList.add("enter"); }
  $("nameFlag").innerHTML = flagSvg(c.id, 28);
  $("name").textContent = student.en;
  const readings = [];
  if (student.native !== student.en && student.native.replace(/\s/g, "") !== student.ko.replace(/\s/g, ""))
    readings.push(["native", `${c.langKo.replace(/^(미국|영국|캐나다|호주|나이지리아) /, "")}`, student.native]);
  readings.push(["", "한국어 표기", student.ko]);
  $("readings").innerHTML = readings.map(([cls, l, v]) => `<span class="reading ${cls}"><span class="lbl">${l}</span><span class="val" dir="auto">${v}</span></span>`).join("");
  $("langLabel").textContent = `(${c.langKo})`;
  $("note").textContent = "";
  const rows = [
    { ko:"국적", en:"Nationality", ic:"🌏", tile:"#e8f0ff", v:`${flagSvg(c.id, 20)}<span>${c.ko} (${c.en.replace(/^the /, "")})</span>` },
    { ko:"성별", en:"Gender", ic:"🙂", tile:"#ffeaf2", v: student.gender === "M" ? "남자 (Boy)" : "여자 (Girl)" },
    ...STATS.map(t => ({ ...t, v:t.fmt(student[t.key]) })),
  ];
  $("info").innerHTML = rows.map(r => `<div style="--tile:${r.tile}"><dt><span class="ic">${r.ic}</span>${r.ko} <small>${r.en}</small></dt><dd>${r.v}</dd></div>`).join("");
  $("idNo").textContent = `No. ${student.idNo}`;
}

$("countrySel").innerHTML = `<option value="">무작위 (Random)</option>` +
  COUNTRIES.map(c => `<option value="${c.id}">${c.ko}</option>`).join("");
$("newBtn").onclick = () => { student = makeStudent($("countrySel").value); render(); };
$("countrySel").onchange = () => $("newBtn").click();
$("renameBtn").onclick = () => { Object.assign(student, makeName(countryOf(student), student.gender, student.en)); render(false); };
$("sayNative").onclick = () => {
  if (!("speechSynthesis" in window)) { $("note").textContent = "이 브라우저는 음성 듣기를 지원하지 않아요."; return; }
  const c = countryOf(student);
  $("note").textContent = say(student.native, c.lang) ? "" : `이 기기에 ${c.langKo} 음성이 없어 기본 음성으로 읽어요.`;
};
$("sayEnglish").onclick = () => {
  if (!("speechSynthesis" in window)) { $("note").textContent = "이 브라우저는 음성 듣기를 지원하지 않아요."; return; }
  say(student.en, "en-US"); $("note").textContent = "";
};

student = makeStudent();
render();
</script>
