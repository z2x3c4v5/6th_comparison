<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 친구 만들기</title>
<style>
  :root {
    --bg: #f3f0ea; --card: #ffffff; --ink: #24262b; --muted: #70747d; --line: #ebe7df;
    --brand: #2f4a7a; --brand-ink: #ffffff; --chip: #f6f4ef;
    --shadow: 0 1px 2px rgba(30,30,40,.06), 0 12px 32px rgba(30,30,40,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181c; --card: #22242a; --ink: #eceef2; --muted: #9da2ad; --line: #33363e;
      --brand: #8fb0e8; --brand-ink: #10213d; --chip: #2a2c33;
      --shadow: 0 12px 32px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181c; --card: #22242a; --ink: #eceef2; --muted: #9da2ad; --line: #33363e;
    --brand: #8fb0e8; --brand-ink: #10213d; --chip: #2a2c33;
    --shadow: 0 12px 32px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 48px; }
  .title { text-align: center; margin-bottom: 22px; }
  .title h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.01em; }
  .title p { margin: 6px 0 0; color: var(--muted); }

  /* Student ID card */
  .id { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
  .id-head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--brand); color: var(--brand-ink); padding: 14px 22px; }
  .id-head .school { font-weight: 700; letter-spacing: .02em; }
  .id-head .kind { font-size: .8rem; opacity: .85; letter-spacing: .12em; text-transform: uppercase; }
  .id-body { display: grid; grid-template-columns: 270px 1fr; gap: 26px; padding: 24px 22px 22px; }
  .photo { border-radius: 14px; overflow: hidden; background: var(--chip); aspect-ratio: 300 / 340; align-self: start;
    box-shadow: inset 0 0 0 1px var(--line); }
  .photo svg { display: block; width: 100%; height: 100%; }
  .name-row { display: flex; align-items: center; gap: 12px; }
  .name { font-size: 2rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; margin: 0; overflow-wrap: anywhere; }
  .flag { display: inline-block; vertical-align: middle; border-radius: 3px; flex: none;
    box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.12); }
  .readings { margin-top: 8px; display: grid; gap: 4px; }
  .reading { display: flex; gap: 10px; align-items: baseline; font-size: 1.08rem; }
  .reading .lbl { flex: none; width: 76px; font-size: .78rem; color: var(--muted); }
  .reading .val { font-weight: 600; }
  .listen { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 4px; }
  .listen button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    padding: 8px 12px; border-radius: 999px; font-size: .92rem; cursor: pointer; }
  .listen button:hover { border-color: var(--brand); }
  .note { font-size: .8rem; color: var(--muted); min-height: 1.2em; }
  dl { margin: 10px 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  dl div { background: var(--chip); border-radius: 12px; padding: 10px 12px; }
  dt { font-size: .78rem; color: var(--muted); }
  dt small { opacity: .8; }
  dd { margin: 2px 0 0; font-size: 1.12rem; font-weight: 700; font-variant-numeric: tabular-nums;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .id-foot { display: flex; justify-content: space-between; gap: 12px; border-top: 1px dashed var(--line);
    padding: 12px 22px; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }

  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  .btn { border: 0; border-radius: 12px; padding: 13px 22px; font-size: 1rem; font-weight: 700; cursor: pointer; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); }
  .btn.secondary { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .btn:hover { filter: brightness(1.06); }
  .pick { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); font-size: .9rem; }
  .pick select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: .95rem; }

  @media (max-width: 640px) {
    main { padding-top: 20px; }
    .id-body { grid-template-columns: 1fr; gap: 18px; }
    .photo { width: min(260px, 100%); margin: 0 auto; }
    .name-row { justify-content: center; }
    .readings { justify-content: center; }
    .listen { justify-content: center; }
    .note { text-align: center; }
  }
</style>
</head>
<body>
<main>
  <div class="title">
    <h1>AI 친구 만들기</h1>
    <p>버튼을 눌러 세계 여러 나라의 새 친구를 만나 보세요</p>
  </div>

  <article class="id" aria-live="polite">
    <div class="id-head">
      <span class="school">Global Friends School</span>
      <span class="kind">Student ID</span>
    </div>
    <div class="id-body">
      <div class="photo" id="photo"></div>
      <div>
        <div class="name-row"><span id="nameFlag"></span><h2 class="name" id="name"></h2></div>
        <div class="readings" id="readings"></div>
        <div class="listen">
          <button type="button" id="sayNative">🔊 이름 듣기 <span id="langLabel"></span></button>
          <button type="button" id="sayEnglish">🔊 영어로 듣기</button>
        </div>
        <div class="note" id="note"></div>
        <dl id="info"></dl>
      </div>
    </div>
    <div class="id-foot"><span id="idNo"></span><span>Grade 6</span></div>
  </article>

  <div class="actions">
    <button class="btn primary" id="newBtn">새로운 친구 만들기</button>
    <button class="btn secondary" id="renameBtn">이름만 바꾸기</button>
  </div>
  <div class="pick">
    <label for="countrySel">국적</label>
    <select id="countrySel"></select>
  </div>
</main>

// ---------- flags (drawn inline so they look the same on every computer) ----------
function star(cx, cy, r, points = 5, rot = -90, inner = .382) {
  const pts = [];
  for (let i = 0; i < points * 2; i++) {
    const a = (rot + i * 180 / points) * Math.PI / 180, rr = i % 2 ? r * inner : r;
    pts.push(`${(cx + rr * Math.cos(a)).toFixed(2)},${(cy + rr * Math.sin(a)).toFixed(2)}`);
  }
  return `M${pts.join(" L")} Z`;
}

function trigram(cx, cy, rot, lines) { // lines: top→bottom, true = solid bar
  return `<g transform="translate(${cx} ${cy}) rotate(${rot})" fill="#000">` + lines.map((solid, i) => {
    const y = (i - 1) * 1.15 - .4;
    return solid ? `<rect x="-2.5" y="${y}" width="5" height=".8"/>`
                 : `<rect x="-2.5" y="${y}" width="2.2" height=".8"/><rect x=".3" y="${y}" width="2.2" height=".8"/>`;
  }).join("") + `</g>`;

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const rand = (a, b) => Math.random() * (b - a) + a;
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const round = (v, d) => +v.toFixed(d);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const rgb2hex = c => "#" + c.map(x => Math.round(x).toString(16).padStart(2, "0")).join("");
const blend = (a, b, t) => { const x = hex2rgb(a), y = hex2rgb(b); return rgb2hex(x.map((v, i) => v + (y[i] - v) * t)); };
const mix = (h, amt) => blend(h, amt < 0 ? "#000000" : "#ffffff", Math.abs(amt)); // amt > 0 lightens, < 0 darkens

function makeName(c, gender, avoid) {
  for (let i = 0; i < 30; i++) {
    const g = pick(gender === "M" ? c.m : c.f), fam = pick(c.fam);
    const en = `${g.en} ${fam.en}`;
    if (en === avoid) continue;
    const familyFirst = c.order === "family";
    return {
      en,
      native: familyFirst ? fam.native + c.sep + g.native : `${g.native} ${fam.native}`,
      ko: familyFirst ? fam.ko + (c.koSep ?? " ") + g.ko : `${g.ko} ${fam.ko}`,
    };
  }
}

function makeStudent(countryId) {
  const c = COUNTRIES.find(x => x.id === countryId) || pick(COUNTRIES);
  const gender = Math.random() < .5 ? "M" : "F";
  const skin = pick(c.skin);
  const darkFeatures = skin >= 3 || ["KR","JP","CN","VN","IN","EG","MX"].includes(c.id);
  const hair = darkFeatures ? pick([0, 0, 1]) : pick([0, 1, 2, 2, 3, 3, 4, 5]);
  const eye = darkFeatures ? pick([0, 1]) : pick([0, 1, 2, 3, 4, 5]);
  let style = pick(STYLES[gender]);
  if (c.curly && Math.random() < .6) style = gender === "M" ? pick(["curly", "buzz"]) : "curlyLong";
  const height = round(rand(140, 168), 1);
  return {
    country: c.id, gender, ...makeName(c, gender),
    look: { skin, hair, eye, style, glasses: Math.random() < .2, smile: Math.random() < .5 ? "open" : "closed",
            backdrop: randInt(0, BACKDROP.length - 1), uniform: randInt(0, UNIFORM.length - 1) },
    height,
    weight: round(clamp((height - 100) * .78 + rand(-7, 8), 30, 66), 1),
    grip:   round(clamp((height - 120) * .45 + rand(-5, 7), 12, 38), 1),
    run:    round(rand(7.6, 10.4), 2),
    pen:    round(rand(12, 18.5), 1),
    bag:    randInt(6, 15),
    idNo:   `GFS-${new Date().getFullYear()}-${String(randInt(1, 9999)).padStart(4, "0")}`,
  };
}

// ---------- speech ----------
let voices = [];
const loadVoices = () => { try { voices = speechSynthesis.getVoices(); } catch (e) {} };
if ("speechSynthesis" in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function findVoice(lang) {
  const base = lang.split("-")[0];
  return voices.find(v => v.lang.replace("_", "-") === lang) || voices.find(v => v.lang.startsWith(base));
}
// Returns true when a voice for the language was found, false when the browser falls back to its default.
function say(text, lang) {
  loadVoices();
  const voice = findVoice(lang);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang; u.rate = .85;
  if (voice) u.voice = voice;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  return !!voice;
}

// ---------- render ----------
let student;
const countryOf = s => COUNTRIES.find(x => x.id === s.country);
function render() {
  const c = countryOf(student);
  $("photo").innerHTML = portrait(student);
  $("nameFlag").innerHTML = flagSvg(c.id, 26);
  $("name").textContent = student.en;
  const readings = [];
  if (student.native !== student.en && student.native.replace(/\s/g, "") !== student.ko.replace(/\s/g, ""))
    readings.push([`${c.langKo.replace(/^(미국|영국|캐나다|호주|나이지리아) /, "")} 표기`, student.native]);
  readings.push(["한국어 표기", student.ko]);
  $("readings").innerHTML = readings.map(([l, v]) => `<div class="reading"><span class="lbl">${l}</span><span class="val" dir="auto">${v}</span></div>`).join("");
  $("langLabel").textContent = `(${c.langKo})`;
  $("note").textContent = "";
  const rows = [
    { ko:"국적", en:"Nationality", v:`${flagSvg(c.id, 20)}<span>${c.ko} (${c.en.replace(/^the /, "")})</span>` },
    { ko:"성별", en:"Gender", v: student.gender === "M" ? "남자 (Boy)" : "여자 (Girl)" },
    ...STATS.map(t => ({ ko:t.ko, en:t.en, v:t.fmt(student[t.key]) })),
  ];
  $("info").innerHTML = rows.map(r => `<div><dt>${r.ko} <small>${r.en}</small></dt><dd>${r.v}</dd></div>`).join("");
  $("idNo").textContent = `No. ${student.idNo}`;
}

$("countrySel").innerHTML = `<option value="">무작위 (Random)</option>` +
  COUNTRIES.map(c => `<option value="${c.id}">${c.ko}</option>`).join("");
$("newBtn").onclick = () => { student = makeStudent($("countrySel").value); render(); };
$("countrySel").onchange = () => $("newBtn").click();
$("renameBtn").onclick = () => { Object.assign(student, makeName(countryOf(student), student.gender, student.en)); render(); };
$("sayNative").onclick = () => {
  if (!("speechSynthesis" in window)) { $("note").textContent = "이 브라우저는 음성 듣기를 지원하지 않아요."; return; }
  const c = countryOf(student);
  $("note").textContent = say(student.native, c.lang) ? "" : `이 기기에 ${c.langKo} 음성이 없어 기본 음성으로 읽어요.`;
};
$("sayEnglish").onclick = () => {
  if (!("speechSynthesis" in window)) { $("note").textContent = "이 브라우저는 음성 듣기를 지원하지 않아요."; return; }
  say(student.en, "en-US"); $("note").textContent = "";
};

student = makeStudent();
render();
</script>
